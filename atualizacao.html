<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/script.js" type="module" defer></script>
    <link rel="stylesheet" href="css/atualizacao.css">
    <title>Admin</title>
</head>

<body>
    <h2>Área do Administrador</h2>
    <a href="index.html">Home</a>

    <div class="form-container">
        <h3>Adicionar Novo Produto</h3>
        <label for="produto">Nome do produto:</label>
        <input type="text" id="produto">

        <label for="codigo">Código do Produto (único):</label>
        <input type="text" id="codigo">

        <label for="preco">Preço do Produto (Ex: 99.90):</label>
        <input type="text" id="preco">

        <label for="linkAmazon">Link da Amazon:</label>
        <input type="text" id="linkAmazon">

        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao">

        <label for="arq">Imagem para site:</label>
        <input type="file" id="arq">

        <button id="btn-enviar">Enviar Dados</button>
    </div>


    <hr class="separator">
    <h2>Gerenciar Produtos</h2>

    <div id="lista-produtos">
        </div>

</body>

</html>
